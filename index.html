async function dec(pw){
  var raw=Uint8Array.from(atob(P),function(c){return c.charCodeAt(0);});
  var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function openDeck(pw,silent){
  try{
    var html=await dec(pw);
    try{sessionStorage.setItem('sis-pw',pw);}catch(e){}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){
    if(!silent)document.getElementById('err').textContent='Nieprawidłowe hasło.';
    return false;
  }
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();openDeck(document.getElementById('pw').value,false);});
(async function(){
  var pw=null,m=location.hash.match(/[#&]k=([^&]+)/);
  if(m){pw=decodeURIComponent(m[1]);try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  if(!pw){try{pw=sessionStorage.getItem('sis-pw');}catch(e){}}
  if(pw){await openDeck(pw,true);}
})();
